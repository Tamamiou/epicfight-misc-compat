modLoader="javafml"
loaderVersion="${loader_version_range}"
license="All Rights Reserved"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Epic Fight Misc Compatibility"
authors="Tamamiou"

logoFile="logo.png"
description='''
史诗战斗杂项兼容：把多个模组的武器与护甲接入 Epic Fight。

* 内置数据包：灾变的武器动作与护甲能力、井然有矿的护甲、农夫乐事及其附属的刀
* 代码修复：数据包做不到的部分（自定义护甲模型在战斗模式下的槽位错位）
* 软联动：检测到夜幕（NightFall）时，部分武器自动套用其动作与粒子特效；未安装则回退到 Epic Fight 原生动作
'''

# ================== 必需依赖 ==================

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="epicfight"
type="required"
versionRange="[21.14.0,)"
ordering="NONE"
side="BOTH"

# ================== 可选联动（未安装时对应数据不生效，不影响启动） ==================

[[dependencies.${mod_id}]]
modId="oreganized"
type="optional"
versionRange="[5.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="farmersdelight"
type="optional"
versionRange="[1.21.1-1.3.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cataclysm"
type="optional"
versionRange="[1.21.1-3.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="efn"
type="optional"
versionRange="[3.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aaa_particles"
type="optional"
versionRange="[2.0.0,)"
ordering="AFTER"
side="BOTH"
